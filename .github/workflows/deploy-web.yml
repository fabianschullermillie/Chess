name: Deploy web app (GitHub Pages)

on:
  push:
    branches: [inkcalidraw]
    paths: ["web/**", "sync/src/protocol.ts", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        working-directory: web
        env:
          VITE_SYNC_URL: ${{ vars.SYNC_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - name: Publish to the gh-pages branch (replaces the previous site; its history stays in the branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web/dist
          commit_message: "Deploy Inkcalidraw web app"
