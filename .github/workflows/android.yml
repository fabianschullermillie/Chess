name: Build prototype APK

on:
  push:
    branches: [inkcalidraw]
  workflow_dispatch:

concurrency:
  group: inkcalidraw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (writes Excalidraw fixtures)
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check fixtures against the real Excalidraw package
        working-directory: tools/compat
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run check

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: inkcalidraw-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Excalidraw render check
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: excalidraw-render-check-${{ github.run_number }}
          path: |
            fixtures/*.png
            fixtures/*.excalidraw
          if-no-files-found: ignore

  device-tests:
    # Runs the editor on an Android tablet emulator with synthetic S Pen input and saves screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run device tests on a tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || touch device-tests-failed
            mkdir -p device-screens && adb pull /sdcard/Android/data/dev.inkcalidraw/files/screens device-screens/ || true
            test ! -f device-tests-failed

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: device-test-screens-${{ github.run_number }}
          path: |
            device-screens/
            app/build/reports/androidTests/
          if-no-files-found: ignore
