name: Build prototype APK

on:
  push:
    branches: [inkcalidraw]
  workflow_dispatch:

concurrency:
  group: inkcalidraw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (writes Excalidraw fixtures)
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check fixtures against the real Excalidraw package
        working-directory: tools/compat
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run check

      - name: Build APK
        env:
          SYNC_URL: ${{ vars.SYNC_URL }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: inkcalidraw-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Excalidraw render check
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: excalidraw-render-check-${{ github.run_number }}
          path: |
            fixtures/*.png
            fixtures/*.excalidraw
          if-no-files-found: ignore

  device-tests:
    # Runs the editor on an Android tablet emulator with synthetic S Pen input and saves screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run device tests on a tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Installed and run by hand (not connectedAndroidTest) so the app isn't uninstalled before we pull screenshots.
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r dev.inkcalidraw.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt || true
            mkdir -p device-screens && adb pull /sdcard/Android/data/dev.inkcalidraw/files/screens device-screens/ || true
            cp instrument.txt device-screens/ || true
            grep -E "^(OK|FAILURES|Tests run)" instrument.txt || true
            grep -q "^OK (" instrument.txt

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: device-test-screens-${{ github.run_number }}
          path: device-screens/
          if-no-files-found: ignore

  sync-tests:
    # Sync server in the local Workers runtime + the web app, driven by a simulated tablet and two browser tabs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: |
          (cd sync && npm install --no-audit --no-fund)
          (cd web && npm install --no-audit --no-fund)
          (cd tools/compat && npm install --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Typecheck
        run: (cd sync && npx tsc --noEmit) && (cd web && npx tsc --noEmit)
      - name: Start sync server and web app
        run: |
          cd sync
          printf 'TOKEN_SECRET=ci-secret\nDEV_LOGIN=1\nGITHUB_CLIENT_ID=x\nGITHUB_CLIENT_SECRET=x\n' > .dev.vars
          nohup npx wrangler dev --local --port 8787 > ../wrangler.log 2>&1 &
          cd ../web && VITE_SYNC_URL=http://127.0.0.1:8787 npx vite build && (nohup npx vite preview --port 5173 --host 127.0.0.1 > ../vite.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ && curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
      - name: Protocol and server tests
        run: cd sync && node --experimental-strip-types --no-warnings test/e2e.mjs
      - name: Live sync between tablet client and browser tabs
        run: cd sync && mkdir -p ../web-shots && SHOTS=../web-shots node --experimental-strip-types --no-warnings test/web-e2e.mjs
      - name: Kotlin client against the server
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew --no-daemon testDebugUnitTest --tests '*SyncProtocolTest*'
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sync-test-${{ github.run_number }}
          path: |
            web-shots/
            wrangler.log
          if-no-files-found: ignore
