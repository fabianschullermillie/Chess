name = "inkcalidraw-sync"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# One Durable Object per note (live sync + storage) and one per user (note library).
[[durable_objects.bindings]]
name = "NOTES"
class_name = "NoteRoom"

[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "Library"

# SQLite-backed Durable Objects are what the Workers free plan supports.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NoteRoom", "Library"]

# Images and PDFs, content-addressed by SHA-1 (uploaded once, shared by all notes).
[[r2_buckets]]
binding = "FILES"
bucket_name = "inkcalidraw-files"

[vars]
# GitHub logins allowed to use this server (comma separated). Personal service.
ALLOWED_USERS = ""
# Where the web app lives (for the OAuth redirect and CORS).
WEB_ORIGIN = "http://localhost:5173"

# Secrets (set with `wrangler secret put`): GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, TOKEN_SECRET
